<meta charset="UTF-8">
<title>Cross-Product Issue Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F1F3F8;
    --surface: #FFFFFF;
    --surface-2: #FAFBFD;
    --border: #DADFE7;
    --border-soft: #E6E9F0;
    --ink: #1B2029;
    --ink-dim: #5B6472;
    --ink-faint: #8A90A0;

    --c-map: #966A17;
    --c-common: #35479A;
    --c-rider: #AE4F2E;
    --c-driver: #1F7A66;

    --cat-a: #6D28D9;
    --cat-b: #B45309;
    --cat-c: #0E7490;
    --cat-d: #BE123C;

    --status-progress: #2B5FD9;
    --status-progress-bg: #E7EDFC;
    --status-fixed: #1C8657;
    --status-fixed-bg: #E4F4EC;
    --status-icebox: #5B6472;
    --status-icebox-bg: #EAEDF1;
    --status-inbox: #8B8F98;
    --status-inbox-bg: #F0F1F4;

    --shadow: 0 1px 2px rgba(20, 24, 34, 0.04), 0 6px 16px -8px rgba(20, 24, 34, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141C;
      --surface: #1A1F29;
      --surface-2: #1F2531;
      --border: #2D3340;
      --border-soft: #262C38;
      --ink: #E9EBF0;
      --ink-dim: #9CA3B2;
      --ink-faint: #6C7383;

      --c-map: #D9A53F;
      --c-common: #8296E6;
      --c-rider: #E28A68;
      --c-driver: #4FC4A8;

      --cat-a: #B794F6;
      --cat-b: #E8A94E;
      --cat-c: #4FD1D9;
      --cat-d: #F0708E;

      --status-progress: #85ACFF;
      --status-progress-bg: #1E2A47;
      --status-fixed: #63DBA6;
      --status-fixed-bg: #163228;
      --status-icebox: #9FA8B6;
      --status-icebox-bg: #262B34;
      --status-inbox: #AEB4BF;
      --status-inbox-bg: #232730;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #11141C;
    --surface: #1A1F29;
    --surface-2: #1F2531;
    --border: #2D3340;
    --border-soft: #262C38;
    --ink: #E9EBF0;
    --ink-dim: #9CA3B2;
    --ink-faint: #6C7383;

    --c-map: #D9A53F;
    --c-common: #8296E6;
    --c-rider: #E28A68;
    --c-driver: #4FC4A8;

    --cat-a: #B794F6;
    --cat-b: #E8A94E;
    --cat-c: #4FD1D9;
    --cat-d: #F0708E;

    --status-progress: #85ACFF;
    --status-progress-bg: #1E2A47;
    --status-fixed: #63DBA6;
    --status-fixed-bg: #163228;
    --status-icebox: #9FA8B6;
    --status-icebox-bg: #262B34;
    --status-inbox: #AEB4BF;
    --status-inbox-bg: #232730;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", "Noto Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 28px 72px;
  }

  header.top {
    margin-bottom: 30px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Archivo", "Source Sans 3", sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 3.6vw, 38px);
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    text-wrap: balance;
  }

  .lede {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--ink-dim);
    max-width: 68ch;
    margin: 0 0 10px;
  }

  .lede b { color: var(--ink); font-weight: 600; }

  .lede-list {
    margin: 0 0 26px;
    padding: 0;
    max-width: 62ch;
    display: flex;
    flex-direction: column;
    gap: 6px;
    list-style: none;
  }

  .lede-list li {
    position: relative;
    padding-left: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-dim);
  }

  .lede-list li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink-faint);
  }

  .lede-list b { color: var(--ink); font-weight: 600; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 30px;
  }

  .legend-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .legend-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-right: 2px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
  }

  .chip .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--dot-color, var(--ink-faint));
    flex: none;
  }

  .pill-sample {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .pill-sample.progress { color: var(--status-progress); background: var(--status-progress-bg); }
  .pill-sample.fixed { color: var(--status-fixed); background: var(--status-fixed-bg); }
  .pill-sample.icebox { color: var(--status-icebox); background: var(--status-icebox-bg); }
  .pill-sample.inbox { color: var(--status-inbox); background: var(--status-inbox-bg); }
  .pill-sample.planned {
    color: var(--ink-faint);
    background: transparent;
    border: 1px dashed var(--ink-faint);
  }

  .divider {
    width: 1px;
    background: var(--border);
    align-self: stretch;
    margin: 0 2px;
  }

  .spacer { flex: 1 1 auto; }

  .btn {
    font-family: "Source Sans 3", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { border-color: var(--ink-faint); color: var(--ink); }

  .save-state {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 128px;
  }

  .view-switch {
    display: inline-flex;
    padding: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    gap: 2px;
  }

  .view-btn {
    font-family: "Source Sans 3", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .view-btn:hover { color: var(--ink); }
  .view-btn.is-active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  /* ---- matrix ---- */

  .matrix-shell {
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    background: var(--surface-2);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .matrix-scroll {
    overflow-x: auto;
    overflow-y: hidden;
  }

  .matrix-scroll::-webkit-scrollbar { height: 10px; }
  .matrix-scroll::-webkit-scrollbar-track { background: transparent; }
  .matrix-scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .matrix-grid {
    display: grid;
    grid-template-columns: 158px repeat(4, 272px);
    min-width: fit-content;
  }

  .col-head {
    position: sticky;
    top: 0;
    background: var(--surface-2);
    padding: 18px 14px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-dim);
    text-wrap: balance;
    line-height: 1.3;
  }

  .col-head.corner { background: var(--surface-2); }

  .row-label {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 20px 14px 20px 20px;
    border-right: 1px solid var(--border-soft);
    background: var(--surface-2);
  }

  .row-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: 14.5px;
    color: var(--lane-accent);
  }
  .row-tag::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 3px;
    background: var(--lane-accent);
    flex: none;
  }

  .row-sub {
    font-size: 11.5px;
    color: var(--ink-faint);
    line-height: 1.4;
  }

  .cell {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    border-right: 1px solid var(--border-soft);
    border-top: 1px solid var(--border-soft);
    min-height: 54px;
  }

  [data-lane="map"] { --lane-accent: var(--c-map); }
  [data-lane="common"] { --lane-accent: var(--c-common); }
  [data-lane="rider"] { --lane-accent: var(--c-rider); }
  [data-lane="driver"] { --lane-accent: var(--c-driver); }

  .node {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-top: 3px solid var(--lane-accent);
    border-radius: 10px;
    padding: 10px 11px 9px;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: box-shadow 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
  }

  a.node:hover {
    box-shadow: var(--shadow);
    border-color: var(--lane-accent);
  }

  .node.is-planned {
    border-top-style: dashed;
    border-top-width: 2px;
    background: transparent;
    border-color: var(--border);
  }
  .node.is-planned .code { color: var(--ink-faint); font-style: italic; }

  .node.off-target {
    opacity: 0.42;
    filter: grayscale(55%);
  }
  .node.off-target:hover,
  .node.off-target:focus-within {
    opacity: 1;
    filter: none;
  }

  .node-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--lane-accent);
    background: color-mix(in srgb, var(--lane-accent) 14%, transparent);
    padding: 2px 6px;
    border-radius: 5px;
  }

  .code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .node-title {
    font-size: 12.6px;
    line-height: 1.38;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
    cursor: text;
    border-radius: 4px;
    padding: 1px 3px;
    margin: 0 -3px;
  }
  .node-title:hover { background: color-mix(in srgb, var(--lane-accent) 10%, transparent); }
  .node-title[contenteditable="true"] {
    background: var(--surface);
    outline: 1.5px dashed var(--lane-accent);
  }

  .node-bottom {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .status {
    display: inline-flex;
    align-self: flex-start;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    background: none;
  }
  .status.progress { color: var(--status-progress); background: var(--status-progress-bg); }
  .status.fixed { color: var(--status-fixed); background: var(--status-fixed-bg); }
  .status.icebox { color: var(--status-icebox); background: var(--status-icebox-bg); }
  .status.inbox { color: var(--status-inbox); background: var(--status-inbox-bg); }
  .status.planned {
    color: var(--ink-faint);
    background: transparent;
    border: 1px dashed var(--ink-faint);
  }

  .meta {
    font-size: 10.8px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    cursor: text;
    border-radius: 4px;
    padding: 1px 3px;
    margin: 0 -3px;
  }
  .meta:hover { background: color-mix(in srgb, var(--lane-accent) 10%, transparent); }
  .meta[contenteditable="true"] {
    background: var(--surface);
    outline: 1.5px dashed var(--lane-accent);
  }

  .note {
    font-size: 10.3px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .cell-empty {
    font-size: 11px;
    color: var(--ink-faint);
    opacity: 0.5;
  }

  /* ---- list view ---- */

  .list-shell {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .list-lane-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .list-lane-head .row-tag { font-size: 13px; }
  .list-lane-head .row-sub { font-size: 11px; }

  .list-table-wrap {
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
    overflow-x: auto;
  }

  table.list-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .list-table col.c-drag { width: 20px; }
  .list-table col.c-col { width: 44px; }
  .list-table col.c-code { width: 58px; }
  .list-table col.c-milestone { width: 68px; }
  .list-table col.c-status { width: 92px; }
  .list-table col.c-priority { width: 58px; }
  .list-table col.c-assignee { width: 58px; }
  .list-table col.c-remark { width: 100px; }

  .list-table thead th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    white-space: nowrap;
  }
  .list-table thead th.num,
  .list-table tbody td.num { text-align: center; }

  .list-table tbody tr {
    border-bottom: 1px solid var(--border-soft);
    cursor: grab;
    transition: background 0.15s ease;
  }
  .list-table tbody tr:last-child { border-bottom: none; }
  .list-table tbody tr:hover { background: var(--surface-2); }

  .list-table tbody tr.off-target { opacity: 0.42; }
  .list-table tbody tr.off-target:hover { opacity: 1; }

  .list-table tbody tr.dragging { opacity: 0.3; }
  .list-table tbody tr.drag-over td { box-shadow: inset 0 1.5px 0 0 var(--lane-accent), inset 0 -1.5px 0 0 var(--lane-accent); }

  .list-table td {
    padding: 7px 10px;
    vertical-align: middle;
    font-size: 12.4px;
    color: var(--ink);
  }

  .list-drag-handle {
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: -1px;
    opacity: 0.4;
    user-select: none;
    cursor: grab;
  }
  .list-drag-handle:active { cursor: grabbing; }

  .list-link {
    color: inherit;
    text-decoration: none;
  }

  td.cell-col {
    text-align: center;
  }

  .col-select {
    appearance: none;
    -webkit-appearance: none;
    display: inline-block;
    width: 24px;
    height: 20px;
    line-height: 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    text-indent: 0;
    color: var(--cat-color);
    background: color-mix(in srgb, var(--cat-color) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--cat-color) 32%, transparent);
    border-radius: 6px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: clip;
  }
  .col-select:hover,
  .col-select:focus {
    border-color: var(--cat-color);
  }

  .col-select option { color: var(--ink); background: var(--surface); }

  .col-select[data-col="a"] { --cat-color: var(--cat-a); }
  .col-select[data-col="b"] { --cat-color: var(--cat-b); }
  .col-select[data-col="c"] { --cat-color: var(--cat-c); }
  .col-select[data-col="d"] { --cat-color: var(--cat-d); }

  td.cell-code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    border-right: 1px solid var(--border-soft);
  }

  td.cell-title {
    font-weight: 600;
    line-height: 1.4;
  }

  .editable-cell {
    cursor: text;
    border-radius: 4px;
    padding: 2px 4px;
    margin: 0 -4px;
    display: inline-block;
    min-width: 10px;
  }
  .editable-cell:hover { background: color-mix(in srgb, var(--lane-accent) 10%, transparent); }
  .editable-cell[contenteditable="true"] {
    background: var(--surface);
    outline: 1.5px dashed var(--lane-accent);
  }
  .editable-cell:empty::before {
    content: "—";
    color: var(--ink-faint);
  }

  td.cell-milestone,
  td.cell-priority,
  td.cell-assignee {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
  }

  td.cell-remark {
    font-size: 11.5px;
    color: var(--ink-faint);
    font-style: italic;
  }

  td.cell-status { white-space: nowrap; }
  td.cell-status .status { font-size: 10.5px; }

  footer.foot {
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  footer.foot .k { font-family: "IBM Plex Mono", monospace; }
</style>

<div class="page">
  <header class="top">
    <p class="eyebrow">PUDO · Last updated 2026-10-07</p>
    <h1>CROSS-PRODUCT ISSUE MATRIX</h1>
    <ul class="lede-list">
      <li><b>맵데이터</b> — 승하차 가능 여부를 결정하는 기반 데이터</li>
      <li><b>공통</b> — PUDO 데이터 구조와 negotiation 등 코어 정책·시나리오</li>
      <li><b>라이더앱 / 드라이버앱</b> — 같은 상황을 각자의 화면으로 보여주는 승객·기사 UX</li>
    </ul>

    <div class="toolbar">
      <div class="legend-group">
        <span class="legend-label">레포</span>
        <span class="chip"><span class="dot" style="--dot-color: var(--c-map)"></span>맵데이터</span>
        <span class="chip"><span class="dot" style="--dot-color: var(--c-common)"></span>공통</span>
        <span class="chip"><span class="dot" style="--dot-color: var(--c-rider)"></span>라이더앱</span>
        <span class="chip"><span class="dot" style="--dot-color: var(--c-driver)"></span>드라이버앱</span>
      </div>
      <div class="spacer"></div>
      <div class="view-switch" id="viewSwitch">
        <button type="button" class="view-btn is-active" data-view="board">보드</button>
        <button type="button" class="view-btn" data-view="list">리스트</button>
      </div>
      <span class="save-state" id="saveState">저장됨</span>
    </div>
  </header>

  <div class="matrix-shell" id="boardView">
    <div class="matrix-scroll" id="scroll">
      <div class="matrix-grid" id="grid"></div>
    </div>
  </div>

  <div class="list-shell" id="listView" hidden></div>

  <footer class="foot">
    <span class="k">2026-10-07</span>
    <span>기준 · 제목·마일스톤은 더블클릭, 현황 뱃지는 클릭해서 바로 수정 — 변경은 이 브라우저에 자동 저장됩니다</span>
  </footer>
</div>

<script>
  const STORAGE_KEY = "pudo-map-nodes-v7";

  const REPO = {
    map: "hkmc-airlab/shucle-map-tool-doc",
    common: "hkmc-airlab/shucle-product",
    rider: "hkmc-airlab/shucle-rider",
    driver: "hkmc-airlab/shucle-DriverVehicle-product",
  };

  const LANES = [
    { id: "map", label: "맵데이터", sub: "기반 작업", tag: "맵툴" },
    { id: "common", label: "공통", sub: "코어 시나리오", tag: "공통" },
    { id: "rider", label: "라이더앱", sub: "승객 UX", tag: "라앱" },
    { id: "driver", label: "드라이버앱", sub: "기사 UX", tag: "드앱" },
  ];

  const LIST_LANE_ORDER = ["common", "map", "rider", "driver"];

  const COLUMNS = [
    { id: "a", label: "A. PUDO 구축" },
    { id: "b", label: "B. PUDO 운영 및 고도화" },
    { id: "c", label: "C. AV 호출·배차 시나리오" },
    { id: "d", label: "D. AV 주행·정차 시나리오" },
  ];

  const DEFAULT_NODES = [
    { id: "map-blacklist", lane: "map", col: "a", code: "532", title: "승하차 지점(주정차 불가) 관리 기능", status: "progress", priority: "High", milestone: "4.14.0", assignee: "애란", remark: "" },
    { id: "map-hae-view", lane: "map", col: "a", code: "545", title: "HAE 데이터 연동 협의 및 뷰어 레이어 1차 개발", status: "progress", priority: "High", milestone: "4.14.0", assignee: "애란", remark: "" },
    { id: "map-hae-block", lane: "map", col: "a", code: "546", title: "HAE 데이터 차단 데이터로 사용", status: "inbox", priority: "P2", milestone: "4.15.0", assignee: "애란", remark: "" },
    { id: "map-whitelist", lane: "map", col: "a", code: "537", title: "앱 PuDo 데이터 연동", status: "inbox", priority: "P1", milestone: "4.15.0", assignee: "애란", remark: "" },
    { id: "map-zonecheck", lane: "map", col: "a", code: "569", title: "푸도 가능 영역 확인 기능 추가", status: "inbox", priority: "P3", milestone: "4.15.0", assignee: "애란", remark: "" },
    { id: "map-usecheck", lane: "map", col: "b", code: "571", title: "영역 PuDo 사용 여부 체크 옵션 추가", status: "icebox", priority: "", milestone: "4.16.0", assignee: "애란", remark: "" },
    { id: "map-gap", lane: "map", col: "b", code: "572", title: "도로 이격 발생 시 블랙리스트 데이터 처리", status: "icebox", priority: "", milestone: "4.16.0", assignee: "애란", remark: "" },
    { id: "map-points", lane: "map", col: "b", code: "536", title: "PuDo Points 관리 기능", status: "icebox", priority: "P2", milestone: "미정", assignee: "애란", remark: "" },

    { id: "common-a", lane: "common", col: "a", code: "3241", repo: "rider", title: "데이터 구조 및 관리 정책", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "이관예정", note: "cf. 맵툴 #537, #569" },
    { id: "common-b", lane: "common", col: "b", code: "3269", repo: "rider", title: "PUDO 운영 및 고도화 (정차 데이터 활용 등)", status: "inbox", priority: "P1", milestone: "미정", assignee: "은지", remark: "이관예정", note: "cf. 맵툴 #536, #571, #572 · 라앱 #3270" },
    { id: "common-c", lane: "common", col: "c", code: null, title: "AV 호출 시나리오 및 배차 정책", status: "planned", priority: "P1", milestone: "4.15.0", assignee: "", remark: "", note: "cf. 라앱 #3242, #3286, #3238" },
    { id: "common-d-pick", lane: "common", col: "d", code: "3239", repo: "rider", title: "Pick 정차 Fallback 시나리오", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "이관예정", note: "cf. 라앱 #3289 · 드앱 #1028" },
    { id: "common-d-drop", lane: "common", col: "d", code: "3240", repo: "rider", title: "Drop 정차 Fallback 시나리오", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "이관예정", note: "cf. 라앱 #3290 · 드앱 #1028" },
    { id: "common-d-drive", lane: "common", col: "d", code: "3268", repo: "rider", title: "주행 Fallback 시나리오 (P/D 포함 도로 진입 불가)", status: "inbox", priority: "P1", milestone: "미정", assignee: "은지", remark: "이관예정", note: "cf. 라앱 #3292 · 드앱 #1036" },

    { id: "rider-log", lane: "rider", col: "b", code: "3270", title: "정차 로그 스키마 정의", status: "fixed", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "" },
    { id: "rider-dispatch", lane: "rider", col: "c", code: "3242", title: "AV D2D 배차 정책 (PUDO 반영)", status: "fixed", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "" },
    { id: "rider-point", lane: "rider", col: "c", code: "3286", title: "PUDO Point 노출 로직", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "" },
    { id: "rider-provide", lane: "rider", col: "c", code: "3293", title: "PUDO 제공 로직 (기술사 전달)", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "은지", remark: "기술사 디펜던시" },
    { id: "rider-ux", lane: "rider", col: "c", code: "3238", title: "D2D AV > 가호출·호출 UX (PUDO 반영)", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "희원", remark: "" },
    { id: "rider-history", lane: "rider", col: "c", code: "3285", title: "메뉴 홈 > 검색기록/호출히스토리 > 운행 정보 데이터 정의", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "희원", remark: "" },
    { id: "rider-search", lane: "rider", col: "c", code: "3227", title: "통합검색 D2D AV 가호출 노출/플로우", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "영연", remark: "" },
    { id: "rider-quick", lane: "rider", col: "c", code: "3228", title: "빠른호출 D2D AV 가호출 노출/플로우", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "영연", remark: "" },
    { id: "rider-usage", lane: "rider", col: "c", code: "3265", title: "이용/혜택내역 > 운행 정보 데이터 정의", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "차경", remark: "" },
    { id: "rider-nego-pickup", lane: "rider", col: "d", code: "3289", title: "정차 Negotiation 안내 (Pickup)", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "희원", remark: "" },
    { id: "rider-nego-dropoff", lane: "rider", col: "d", code: "3290", title: "정차 Negotiation 안내 (Drop-off)", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "희원", remark: "" },
    { id: "rider-nego-push", lane: "rider", col: "d", code: "3291", title: "D2D AV 타입 앱푸시 신규 추가", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "차경", remark: "" },
    { id: "rider-nego-drive", lane: "rider", col: "d", code: "3292", title: "주행 Fallback 안내 (P/D 포함 도로 진입 불가)", status: "inbox", priority: "P1", milestone: "미정", assignee: "은지", remark: "" },

    { id: "driver-stop", lane: "driver", col: "d", code: "1028", title: "정차 위치 변경/실패 안내", status: "progress", priority: "P1", milestone: "4.15.0", assignee: "윤아", remark: "" },
    { id: "driver-drive", lane: "driver", col: "d", code: "1036", title: "도로 진입 불가 시 안내", status: "inbox", priority: "P1", milestone: "미정", assignee: "윤아", remark: "" },
  ];

  const STATUS_LABEL = { progress: "진행중", fixed: "스펙확정", icebox: "아이스박스", inbox: "인박스", planned: "미생성" };
  const STATUS_CYCLE = ["progress", "fixed", "icebox", "inbox", "planned"];

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const colIds = new Set(COLUMNS.map(c => c.id));
        const valid = Array.isArray(parsed) && parsed.length > 0 && parsed.every(n => colIds.has(n.col));
        if (valid) return parsed;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_NODES));
  }

  let data = loadData();
  const saveStateEl = document.getElementById("saveState");

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    saveStateEl.textContent = "저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }

  function isOffTarget(n) {
    const m = n.milestone || "";
    return !m.includes("4.15.0") && !m.includes("4.14.0");
  }

  function metaText(n) {
    return [n.priority, n.milestone, n.assignee, n.remark].filter(Boolean).join(" · ");
  }

  const grid = document.getElementById("grid");

  function render() {
    grid.innerHTML = "";
    grid.style.gridTemplateRows = `auto repeat(${LANES.length}, auto)`;

    const corner = document.createElement("div");
    corner.className = "col-head corner";
    grid.appendChild(corner);

    COLUMNS.forEach(col => {
      const head = document.createElement("div");
      head.className = "col-head";
      head.textContent = col.label;
      grid.appendChild(head);
    });

    LANES.forEach(lane => {
      const label = document.createElement("div");
      label.className = "row-label lane-row";
      label.dataset.lane = lane.id;
      label.innerHTML = `<span class="row-tag">${lane.label}</span><span class="row-sub">${lane.sub}</span>`;
      grid.appendChild(label);

      COLUMNS.forEach(col => {
        const cell = document.createElement("div");
        cell.className = "cell lane-row";
        cell.dataset.lane = lane.id;

        const items = data.filter(n => n.lane === lane.id && n.col === col.id);
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "cell-empty";
          empty.textContent = "—";
          cell.appendChild(empty);
        } else {
          items.forEach(n => cell.appendChild(renderNode(lane, n)));
        }
        grid.appendChild(cell);
      });
    });
  }

  function renderNode(lane, n) {
    const el = document.createElement(n.code ? "a" : "div");
    if (n.code) {
      el.href = `https://github.com/${REPO[n.repo || lane.id]}/issues/${n.code}`;
      el.target = "_blank";
      el.rel = "noopener";
    }
    el.className = "node"
      + (n.status === "planned" ? " is-planned" : "")
      + (isOffTarget(n) ? " off-target" : "");
    el.dataset.id = n.id;

    const codeHtml = n.code ? `<span class="code">#${n.code}</span>` : `<span class="code">미생성</span>`;

    el.innerHTML = `
      <div class="node-top">
        <span class="tag">${lane.tag}</span>
        ${codeHtml}
      </div>
      <p class="node-title" data-field="title">${n.title}</p>
      <div class="node-bottom">
        <button type="button" class="status ${n.status}" data-field="status">${STATUS_LABEL[n.status]}</button>
        <span class="meta">${metaText(n)}</span>
        ${n.note ? `<span class="note">${n.note}</span>` : ""}
      </div>
    `;

    const titleEl = el.querySelector('[data-field="title"]');
    const statusEl = el.querySelector('[data-field="status"]');

    function makeEditable(fieldEl, key) {
      fieldEl.addEventListener("dblclick", ev => {
        ev.preventDefault();
        ev.stopPropagation();
        fieldEl.contentEditable = "true";
        fieldEl.focus();
        document.execCommand("selectAll", false, null);
      });
      fieldEl.addEventListener("click", ev => {
        if (fieldEl.contentEditable === "true") ev.preventDefault();
      });
      fieldEl.addEventListener("blur", () => {
        fieldEl.contentEditable = "false";
        const val = fieldEl.textContent.trim();
        if (val && val !== n[key]) {
          n[key] = val;
          save();
        }
      });
      fieldEl.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); fieldEl.blur(); }
        if (ev.key === "Escape") { fieldEl.textContent = n[key]; fieldEl.blur(); }
      });
    }

    makeEditable(titleEl, "title");

    statusEl.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(n.status) + 1) % STATUS_CYCLE.length];
      n.status = next;
      save();
      render();
    });

    return el;
  }

  const listEl = document.getElementById("listView");
  let dragSrcId = null;

  function makeListEditable(fieldEl, n, key) {
    fieldEl.addEventListener("dblclick", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      fieldEl.contentEditable = "true";
      fieldEl.focus();
      document.execCommand("selectAll", false, null);
    });
    fieldEl.addEventListener("click", ev => {
      if (fieldEl.contentEditable === "true") ev.preventDefault();
    });
    fieldEl.addEventListener("blur", () => {
      fieldEl.contentEditable = "false";
      const val = fieldEl.textContent.trim();
      if (val !== n[key]) {
        n[key] = val;
        save();
        render();
        renderList();
      }
    });
    fieldEl.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); fieldEl.blur(); }
      if (ev.key === "Escape") { fieldEl.textContent = n[key]; fieldEl.blur(); }
    });
  }

  function renderList() {
    listEl.innerHTML = "";

    LIST_LANE_ORDER.forEach(laneId => {
      const lane = LANES.find(l => l.id === laneId);
      const items = data.filter(n => n.lane === laneId);
      if (!items.length) return;

      const section = document.createElement("div");
      section.className = "list-lane";
      section.dataset.lane = lane.id;

      const head = document.createElement("div");
      head.className = "list-lane-head";
      head.innerHTML = `<span class="row-tag">${lane.label}</span><span class="row-sub">${lane.sub}</span>`;
      section.appendChild(head);

      const wrap = document.createElement("div");
      wrap.className = "list-table-wrap";

      const table = document.createElement("table");
      table.className = "list-table";
      table.innerHTML = `
        <colgroup>
          <col class="c-drag"><col class="c-col"><col class="c-code">
          <col><col class="c-milestone"><col class="c-status">
          <col class="c-priority"><col class="c-assignee"><col class="c-remark">
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th>분류</th>
            <th class="num">이슈</th>
            <th>기능</th>
            <th>마일스톤</th>
            <th>상태</th>
            <th class="num">우선순위</th>
            <th class="num">담당자</th>
            <th>비고</th>
          </tr>
        </thead>
      `;

      const tbody = document.createElement("tbody");

      const groups = [];
      items.forEach(n => {
        const g = groups[groups.length - 1];
        if (g && g.col === n.col) g.rows.push(n);
        else groups.push({ col: n.col, rows: [n] });
      });

      groups.forEach(group => {
        group.rows.forEach((n, idxInGroup) => {
          const row = document.createElement("tr");
          row.className = isOffTarget(n) ? "off-target" : "";
          row.dataset.lane = lane.id;
          row.dataset.id = n.id;

          const linkHref = n.code ? `https://github.com/${REPO[n.repo || lane.id]}/issues/${n.code}` : null;
          const codeInner = n.code ? `#${n.code}` : "미생성";
          const codeHtml = linkHref
            ? `<a class="list-link" href="${linkHref}" target="_blank" rel="noopener">${codeInner}</a>`
            : codeInner;

          const colOptions = COLUMNS.map(c =>
            `<option value="${c.id}" ${c.id === n.col ? "selected" : ""}>${c.id.toUpperCase()} · ${c.label.replace(/^[A-Z]\.\s*/, "")}</option>`
          ).join("");
          const colLabel = COLUMNS.find(c => c.id === n.col)?.label || "";
          const colCellHtml = `<td class="cell-col"><select class="col-select" data-field="col" data-col="${n.col}" title="${colLabel}">${colOptions}</select></td>`;

          row.innerHTML = `
            <td class="list-drag-handle" draggable="true">⠿</td>
            ${colCellHtml}
            <td class="cell-code">${codeHtml}</td>
            <td class="cell-title"><span class="editable-cell" data-field="title">${n.title}</span></td>
            <td class="cell-milestone"><span class="editable-cell" data-field="milestone">${n.milestone || ""}</span></td>
            <td class="cell-status"><button type="button" class="status ${n.status}" data-field="status">${STATUS_LABEL[n.status]}</button></td>
            <td class="cell-priority num"><span class="editable-cell" data-field="priority">${n.priority || ""}</span></td>
            <td class="cell-assignee num"><span class="editable-cell" data-field="assignee">${n.assignee || ""}</span></td>
            <td class="cell-remark"><span class="editable-cell" data-field="remark">${n.remark || ""}</span></td>
          `;

          ["title", "milestone", "priority", "assignee", "remark"].forEach(key => {
            makeListEditable(row.querySelector(`[data-field="${key}"]`), n, key);
          });

          const statusEl = row.querySelector('[data-field="status"]');
          statusEl.addEventListener("click", ev => {
            ev.preventDefault();
            ev.stopPropagation();
            const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(n.status) + 1) % STATUS_CYCLE.length];
            n.status = next;
            save();
            render();
            renderList();
          });

          const colEl = row.querySelector('[data-field="col"]');
          if (colEl) {
            colEl.addEventListener("click", ev => ev.stopPropagation());
            colEl.addEventListener("change", () => {
              n.col = colEl.value;
              save();
              render();
              renderList();
            });
          }

          const handleEl = row.querySelector(".list-drag-handle");
          handleEl.addEventListener("dragstart", ev => {
            dragSrcId = n.id;
            row.classList.add("dragging");
            ev.dataTransfer.effectAllowed = "move";
          });
          handleEl.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            tbody.querySelectorAll("tr.drag-over").forEach(r => r.classList.remove("drag-over"));
          });
          row.addEventListener("dragover", ev => {
            if (dragSrcId === null || dragSrcId === n.id) return;
            const srcNode = data.find(d => d.id === dragSrcId);
            if (!srcNode || srcNode.lane !== n.lane) return;
            ev.preventDefault();
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
          row.addEventListener("drop", ev => {
            ev.preventDefault();
            row.classList.remove("drag-over");
            if (dragSrcId === null || dragSrcId === n.id) return;
            const srcIdx = data.findIndex(d => d.id === dragSrcId);
            const targetIdx = data.findIndex(d => d.id === n.id);
            if (srcIdx === -1 || targetIdx === -1) return;
            const srcNode = data[srcIdx];
            if (srcNode.lane !== n.lane) return;
            data.splice(srcIdx, 1);
            const newTargetIdx = data.findIndex(d => d.id === n.id);
            data.splice(newTargetIdx, 0, srcNode);
            dragSrcId = null;
            save();
            render();
            renderList();
          });

          tbody.appendChild(row);
        });
      });

      table.appendChild(tbody);
      wrap.appendChild(table);
      section.appendChild(wrap);
      listEl.appendChild(section);
    });
  }

  const boardViewEl = document.getElementById("boardView");
  const listViewEl = document.getElementById("listView");
  let currentView = "board";

  document.getElementById("viewSwitch").addEventListener("click", ev => {
    const btn = ev.target.closest(".view-btn");
    if (!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll(".view-btn").forEach(b => b.classList.toggle("is-active", b === btn));
    boardViewEl.hidden = currentView !== "board";
    listViewEl.hidden = currentView !== "list";
    if (currentView === "list") renderList();
  });

  render();
</script>
